<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Current weather with a plain-language AI explanation." />
    <title>WeatherWise</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <p class="eyebrow">CURRENT CONDITIONS</p>
        <h1>WeatherWise</h1>
        <p class="subtitle">Weather data, explained for your day.</p>
      </header>
      <form id="weather-form" novalidate>
        <label for="city">City</label>
        <div class="search-row">
          <input id="city" name="city" type="search" placeholder="e.g. Mumbai" autocomplete="address-level2" required maxlength="100" />
          <button type="submit">Check weather</button>
        </div>
      </form>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <section id="weather-result" class="weather-card" hidden aria-live="polite">
        <div class="location-row"><div><p id="location" class="location"></p><p id="updated" class="muted"></p></div><img id="condition-icon" alt="" /></div>
        <div class="temperature"><span id="temperature"></span><span class="unit">°C</span></div>
        <p id="condition" class="condition"></p>
        <div id="metrics" class="metrics"></div>
        <section class="explanation"><p class="eyebrow">AI WEATHER EXPLANATION</p><p id="explanation"></p></section>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
